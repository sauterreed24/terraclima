# Builds the SPA with relative asset paths (VITE_BASE_PATH=./) and force-pushes
# the resulting dist/ to the `static-preview` branch. The README's primary
# "Live app" link points at raw.githack.com serving that branch, so the URL
# stays in sync with main with no Pages or Vercel configuration required.
name: Publish static-preview branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Force-push dist/ to static-preview branch
        run: |
          tmpdir="$(mktemp -d)"
          cp -a dist/. "$tmpdir"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan static-preview-publish
          git rm -rf --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmpdir"/. .
          git add -A
          git commit -m "Publish static-preview from ${{ github.sha }}"
          git push --force origin HEAD:static-preview
