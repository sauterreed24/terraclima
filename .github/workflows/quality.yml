# Runs `npm run quality:check` on every pull request and on pushes to branches
# other than `main`. Pushes to `main` run the same gate via `quality-main.yml`
# so direct commits cannot bypass typecheck, lint (zero warnings), tests, corpus
# audits, and production build.
name: Quality

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run quality:check
