# Builds the SPA with base path /terraclima/ and publishes to the canonical
# public GitHub Pages URL at https://sauterreed24.github.io/terraclima/.
#
# Pages should use Source: GitHub Actions. The workflow still probes for Pages
# configuration first so forks or fresh clones fail softly with a clear notice
# instead of red-Xing unrelated quality runs.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.pages_enabled }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: check
        name: Check whether GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository. Skipping the Pages build. To publish the public app, enable Settings → Pages → Source: GitHub Actions and re-run this workflow."
          fi
      - if: steps.check.outputs.pages_enabled == 'true'
        name: Setup Pages
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.pages_enabled == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
      - if: steps.check.outputs.pages_enabled == 'true'
        run: npm ci
      - if: steps.check.outputs.pages_enabled == 'true'
        run: npm run build:pages
        env:
          VITE_BUILD_REVISION: ${{ github.sha }}
      - if: steps.check.outputs.pages_enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
