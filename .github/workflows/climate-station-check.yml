# Compares the Daymet climate grid with nearby GHCN-Daily weather stations
# (scripts/climate-data/station-bias.ts), or in "humidity" mode its vapour
# pressure with ISD hourly dew points (scripts/climate-data/station-humidity.ts),
# and in "apply" mode regenerates the Climate V2 assets with the reviewed
# corrections in data/climate-v2/stations/station-bias.json and
# humidity-bias.json.
#
# Network-bound: runs by hand, or (diagnose only) when the checker changes.
# The log carries the diagnostics (BIAS / HUM lines, gzip+base64 DIAG lines)
# and, in apply mode, the
# regenerated assets as a base64 tar.gz ("TGZ" lines) so they can be reviewed
# and committed from an environment without NOAA access.
name: Climate station check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnose (temperature/precipitation), humidity (dew points), or apply (regenerate with the reviewed corrections)"
        required: true
        default: diagnose
        type: choice
        options: [diagnose, humidity, apply]
      ids:
        description: "Comma-separated place ids to diagnose (blank = all)"
        required: false
        default: ""
      radius:
        description: "Humidity mode: station search radius in km"
        required: false
        default: "40"
  push:
    branches-ignore: [main]
    paths:
      - scripts/climate-data/station-bias.ts
      - scripts/climate-data/station-humidity.ts
      - .github/workflows/climate-station-check.yml

permissions:
  contents: read

concurrency:
  group: climate-station-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IDS: ${{ inputs.ids }}
      RADIUS: ${{ inputs.radius || '40' }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Restore Daymet cache
        uses: actions/cache@v4
        with:
          path: .cache/daymet
          key: daymet-v4r1-2025-${{ hashFiles('data/climate-v2/anchors.json') }}
          restore-keys: daymet-v4r1-2025-
      - name: Restore GHCN-Daily cache
        uses: actions/cache@v4
        with:
          path: .cache/ghcnd
          key: ghcnd-${{ github.run_id }}
          restore-keys: ghcnd-
      - name: Restore ISD cache
        if: inputs.mode == 'humidity'
        uses: actions/cache@v4
        with:
          path: .cache/isd
          key: isd-${{ github.run_id }}
          restore-keys: isd-
      - name: Fetch Daymet (resume-safe)
        run: npm run climate:data:fetch -- --through=2025 --concurrency=4
      - name: Compare with stations
        if: inputs.mode != 'apply' && inputs.mode != 'humidity'
        run: |
          npx tsx scripts/climate-data/station-bias.ts --ids "$IDS"
          gzip -9 -c data/climate-v2/stations/station-bias-diagnostics.json | base64 -w 0 | fold -w 6000 | sed 's/^/DIAG /'
          echo
      - name: Compare humidity with stations
        if: inputs.mode == 'humidity'
        run: |
          npx tsx scripts/climate-data/station-humidity.ts --ids "$IDS" --radius-km "$RADIUS"
          gzip -9 -c data/climate-v2/stations/humidity-bias-diagnostics.json | base64 -w 0 | fold -w 6000 | sed 's/^/DIAG /'
          echo
      - name: Regenerate with reviewed corrections
        if: inputs.mode == 'apply'
        run: |
          npm run climate:data:generate
          npm run climate:data:verify
          npm run climate:data:audit
          tar czf /tmp/climate-v2.tgz src/data/generated/climate-v2 data/climate-v2/manifest.json data/climate-v2/audit
          base64 -w 0 /tmp/climate-v2.tgz | fold -w 6000 | sed 's/^/TGZ /'
          echo
